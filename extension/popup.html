<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- Loading -->
      <section id="view-loading" class="view">
        <p class="muted center" style="padding: 18px">loading…</p>
      </section>

      <!-- Signed out. The popup's only job is auth: while signed in the popup
           is cleared and the icon click saves directly, with the on-page card
           (content/toast.js) as the whole save experience. -->
      <section id="view-signin" class="hidden">
        <header class="phead">
          <img class="logo" src="icons/bulletin-logo.png" alt="Bulletin" />
        </header>
        <div class="pbody">
          <p class="muted">Save anything you find — one click, filed to your page.</p>

          <form id="form-email" autocomplete="on">
            <input id="email" class="cfield" type="email" name="email"
              placeholder="Email" autocomplete="username" required />
            <input id="password" class="cfield" type="password" name="password"
              placeholder="Password" autocomplete="current-password" required />
            <button id="btn-email-signin" class="cta" type="submit">Sign in</button>
          </form>

          <div class="divider"><span>or</span></div>

          <button id="btn-signin" class="cta ghost" type="button">Continue with Google</button>
          <p id="signin-hint" class="hint hidden"></p>
          <p class="signup-line">New to Bulletin? <a id="link-create" class="link-inline" href="#">Create an account →</a></p>
        </div>
      </section>

      <!-- Signed in (rarely seen — the icon click saves directly) -->
      <section id="view-ready" class="hidden">
        <div class="pbody">
          <div class="topbar">
            <img class="logo-sm" src="icons/bulletin-logo.png" alt="Bulletin" />
            <button id="btn-signout" class="link">Sign out</button>
          </div>
          <p class="muted" style="margin-bottom: 0">
            You’re all set — click the Bulletin icon on any page to save it instantly.
          </p>
        </div>
      </section>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
