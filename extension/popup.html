<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- Loading -->
      <section id="view-loading" class="view">
        <p class="muted center" style="padding: 18px">loading…</p>
      </section>

      <!-- Signed out -->
      <section id="view-signin" class="hidden">
        <header class="phead">
          <img class="logo" src="icons/bulletin-logo.png" alt="Bulletin" />
        </header>
        <div class="pbody">
          <p class="muted">Save anything you find. Filed to your page.</p>

          <!-- Bulletin is passwordless. Google is primary; the second lane is
               the web's magic-link email, extension-shaped: a link can't hand
               a session to a popup, so the user types the one-time code that
               rides in the same email (see auth.js requestEmailCode). -->
          <button id="btn-signin" class="cta" type="button">Continue with Google</button>
          <button id="btn-apple" class="cta ghost apple" type="button">
            <svg viewBox="0 0 814 1000" aria-hidden="true"><path fill="currentColor" d="M788 341c-6 4-107 61-107 187 0 146 128 198 132 199-1 3-20 70-67 139-42 60-86 120-152 120s-83-38-159-38c-74 0-101 40-161 40s-102-56-150-124C68 785 22 660 22 541c0-191 124-292 246-292 65 0 119 43 160 43 39 0 100-45 174-45 28 0 129 2 186 94zM559 162c30-36 52-86 52-136 0-7-1-14-2-20-49 2-108 33-143 74-28 32-54 82-54 133 0 8 1 15 2 18 3 1 9 2 14 2 44 0 99-30 131-71z"/></svg>
            Continue with Apple
          </button>

          <button id="btn-email-lane" class="link center email-lane" type="button">Email me a code instead</button>

          <form id="form-email" class="hidden" autocomplete="on">
            <input id="email" class="cfield" type="email" name="email"
              placeholder="Email" autocomplete="username" required />
            <button id="btn-email-code" class="cta ghost" type="submit">Email me a code</button>
          </form>

          <form id="form-code" class="hidden" autocomplete="off">
            <!-- This project's GoTrue mints 8-digit codes (not the default 6) -->
            <input id="code" class="cfield code" type="text" name="code" placeholder="Code from the email"
              inputmode="numeric" pattern="\d{6,8}" maxlength="8" autocomplete="one-time-code" required />
            <button id="btn-code-signin" class="cta" type="submit">Sign in</button>
            <button id="btn-code-back" class="link center" type="button">← use a different email</button>
          </form>
          <p id="signin-hint" class="hint hidden"></p>
          <p class="signup-line">New to Bulletin? <a id="link-create" class="link-inline" href="#">Create an account →</a></p>
        </div>
      </section>

      <!-- Signed in: the save. One fixed-size stage (Chrome jumps, never
           animates, a popup window that changes height), and one plate that
           morphs: the save button → the list picker's header tile. Done
           closes the popup; there's no final screen. Phase lives on #stage
           as data-phase: checking | confirm | saving | lists | error | blocked -->
      <section id="view-save" class="hidden">
        <div id="stage" class="stage" data-phase="checking">
          <div class="hair" aria-hidden="true"><div class="hair-fill" id="hair-fill"></div></div>
          <div class="band" aria-hidden="true"></div>


          <button class="plate" id="plate" type="button">
            <canvas class="dots" id="dots" aria-hidden="true"></canvas>
            <img class="shot" id="shot" alt="" />
            <span class="pcenter">
              <img class="pmark" src="icons/mark.png" alt="" />
              <span class="plabel" id="plabel">Loading…</span>
              <span class="pmsg" id="pmsg"></span>
            </span>
            <span class="ring" aria-hidden="true"></span>
          </button>

          <div class="htext">
            <p class="htitle" id="htitle">Saved to your Bulletin</p>
            <p class="hsub" id="hsub">Add it to a list…</p>
          </div>
          <!-- Already saved: take it off your Bulletin (then Undo, same spot). -->
          <button class="hact" id="remove" type="button">Remove</button>

          <div class="lists" id="lists">
            <div id="rows"></div>
            <div class="row create" id="create">
              <span class="clabel">Create new list</span>
              <input class="lfield" id="lfield" autocomplete="off" spellcheck="false" maxlength="80"
                placeholder="List name" aria-label="New list name" />
              <button class="chint" id="chint" type="button">Create ↵</button>
            </div>
          </div>

          <div class="foot">
            <a class="cta ghost profile" id="profile" href="#">
              View your Bulletin
            </a>
            <button class="cta done" id="done" type="button">Skip</button>
          </div>
        </div>
      </section>
    </div>
    <script src="boot.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
