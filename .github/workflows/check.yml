# Mechanical checks on every push and PR.
#
# Deliberately narrow: this proves the code COMPILES and BUILDS, and catches the
# one class of mistake we know recurs and can be spotted by pattern (internal
# links that reload the whole app instead of transitioning).
#
# It is not a test suite and it never opens the app. It would not have caught
# most of what we found by hand — a chip that's invisible on white, a card
# swinging the wrong way, a stale cache still offering a deleted bullet. Those
# need eyes. This just stops a broken build reaching production.
#
# No env vars at all. The build used to need placeholder Supabase values
# because /api/backfill-images constructed a client at module scope and Next
# collects page data at build time; that client is lazy now, so a checkout with
# no credentials builds exactly as a developer's fresh clone does — which is
# the point of checking it here.

name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: types
        run: npx tsc --noEmit

      - name: internal links must not reload the app
        run: node scripts/check-links.mjs

      - name: build
        run: npm run build
