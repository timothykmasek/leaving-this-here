# Bulletin iOS — xcodegen spec. `xcodegen generate` in this directory writes
# Bulletin.xcodeproj; the project file itself is generated output and stays
# out of git. Buildless ethos, iOS edition: no package dependencies, the app
# is a second client of the /api/extension/* endpoints the Chrome extension
# already exercises.
name: Bulletin
options:
  bundleIdPrefix: com.yourbulletin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone-first, like the product
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 99L24P45G7         # Tim's Apple Developer team
    CURRENT_PROJECT_VERSION: "5"
    MARKETING_VERSION: "1.0"

targets:
  Bulletin:
    type: application
    platform: iOS
    sources:
      - Bulletin
    info:
      path: Bulletin/Info.plist
      properties:
        CFBundleDisplayName: Bulletin
        UILaunchScreen: {}                # bare launch screen; paper white
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - MierA-Book.ttf
          - MierA-DemiBold.ttf
          - Cardo-Regular.ttf
          - Cardo-Italic.ttf
          - Cardo-Bold.ttf
    entitlements:
      path: Bulletin/Bulletin.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourbulletin.ios
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourbulletin.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"      # iPhone-only; "1,2" makes App Store Connect demand all four orientations
    dependencies:
      - target: BulletinShare
        embed: true

  BulletinShare:
    type: app-extension
    platform: iOS
    sources:
      - BulletinShare
      - Bulletin/Core                     # Config/Session/API shared with the app
      - Bulletin/Resources/bulletin-logo.png
      - Bulletin/Resources/PrivacyInfo.xcprivacy  # Apple's privacy manifest, one file for both bundles
      - Bulletin/Resources/Fonts
    info:
      path: BulletinShare/Info.plist
      properties:
        CFBundleDisplayName: Bulletin
        UIAppFonts:
          - MierA-Book.ttf
          - MierA-DemiBold.ttf
          - Cardo-Regular.ttf
          - Cardo-Italic.ttf
          - Cardo-Bold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # NOTE: no NSExtensionJavaScriptPreprocessingFile. Tried and
            # reverted: declaring it makes Safari send ONLY a plist item whose
            # load dies in an XPC error on the simulator, losing even the URL.
            # Page context comes from PageProbe (an in-extension fetch from
            # the device's own IP) which also covers non-Safari hosts.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      path: BulletinShare/BulletinShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourbulletin.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourbulletin.ios.share
        TARGETED_DEVICE_FAMILY: "1"
