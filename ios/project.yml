# Bulletin iOS — xcodegen spec. `xcodegen generate` in this directory writes
# Bulletin.xcodeproj; the project file itself is generated output and stays
# out of git. Buildless ethos, iOS edition: no package dependencies, the app
# is a second client of the /api/extension/* endpoints the Chrome extension
# already exercises.
name: Bulletin
options:
  bundleIdPrefix: com.yourbulletin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone-first, like the product
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  Bulletin:
    type: application
    platform: iOS
    sources:
      - Bulletin
    info:
      path: Bulletin/Info.plist
      properties:
        CFBundleDisplayName: Bulletin
        UILaunchScreen: {}                # bare launch screen; paper white
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Bulletin/Bulletin.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourbulletin.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourbulletin.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BulletinShare
        embed: true

  BulletinShare:
    type: app-extension
    platform: iOS
    sources:
      - BulletinShare
      - Bulletin/Core                     # Config/Session/API shared with the app
      - Bulletin/Resources/bulletin-logo.png
    info:
      path: BulletinShare/Info.plist
      properties:
        CFBundleDisplayName: Bulletin
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      path: BulletinShare/BulletinShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourbulletin.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourbulletin.ios.share
